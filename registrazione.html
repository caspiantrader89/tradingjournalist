<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crea un account — TradeJournalist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D12; --bg-elevated:#0F1319; --surface:#141922; --surface-2:#191F2A;
  --border:#232B37; --border-soft:#1A212B; --text:#E9EDF3; --text-dim:#8592A3;
  --text-faint:#4C5768; --green:#33C48B; --red:#F14D68; --amber:#E0A23C;
  --blue:#5B8CFF; --blue-dim:rgba(91,140,255,0.12); --radius:10px; --radius-sm:6px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px;
}
.wrap{width:100%; max-width:440px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:32px 28px;}
.head{text-align:center; margin-bottom:24px; display:flex; flex-direction:column; align-items:center; gap:8px;}
.head h1{font-family:'Space Grotesk'; font-size:21px; font-weight:600;}
.head p{font-size:13px; color:var(--text-dim);}
form{display:flex; flex-direction:column; gap:12px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
label.field-label{font-size:12px; color:var(--text-dim); margin-bottom:4px; display:block;}
input[type="text"], input[type="email"], input[type="password"], select{
  width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:14px; font-family:inherit;
}
select{appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238592A3' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; background-size:16px;}
input:focus, select:focus{outline:none; border-color:var(--blue);}
.consents{display:flex; flex-direction:column; gap:8px; margin-top:2px; padding:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px;}
.consents label{display:flex; align-items:flex-start; gap:8px; font-size:12px; color:var(--text-dim); cursor:pointer;}
.consents input{margin-top:2px; flex:none; width:auto;}
.consents a{color:var(--blue);}
#reg-error{min-height:16px; font-size:12.5px; color:var(--red);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; width:100%;
  padding:11px 15px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:14px; font-weight:500; cursor:pointer;
  text-decoration:none; transition:all .12s; font-family:inherit;
}
.btn:hover{background:var(--surface-2); border-color:#2C3644;}
.btn-primary{background:var(--green); border-color:var(--green); color:#06140E; font-weight:600;}
.btn-primary:hover{background:#3ED89C; border-color:#3ED89C;}
.btn:disabled{opacity:.6; cursor:not-allowed;}
.foot{text-align:center; font-size:13px; color:var(--text-dim); margin-top:18px;}
.foot a{color:var(--blue); text-decoration:none;}
.success{display:none; text-align:center;}
.success svg{margin-bottom:10px;}
.success h2{font-size:17px; margin-bottom:8px;}
.success p{font-size:13.5px; color:var(--text-dim); line-height:1.5;}
html{overflow-x:hidden;}
@media(max-width:380px){
  .row2{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <div id="reg-form-block">
      <div class="head">
        <h1>Crea il tuo account</h1>
        <p>Inizia a tracciare le tue operazioni di trading</p>
      </div>

      <form id="register-form">
        <div class="row2">
          <div>
            <label class="field-label" for="reg-nome">Nome</label>
            <input type="text" id="reg-nome" autocomplete="given-name" required>
          </div>
          <div>
            <label class="field-label" for="reg-cognome">Cognome</label>
            <input type="text" id="reg-cognome" autocomplete="family-name" required>
          </div>
        </div>

        <div>
          <label class="field-label" for="reg-email">Email</label>
          <input type="email" id="reg-email" autocomplete="username" required>
        </div>

        <div class="row2">
          <div>
            <label class="field-label" for="reg-password">Password</label>
            <input type="password" id="reg-password" autocomplete="new-password" required>
          </div>
          <div>
            <label class="field-label" for="reg-password-confirm">Conferma password</label>
            <input type="password" id="reg-password-confirm" autocomplete="new-password" required>
          </div>
        </div>

        <div>
          <label class="field-label" for="reg-paese">Paese <span style="color:var(--text-faint);">(facoltativo)</span></label>
          <select id="reg-paese">
            <option value="" selected>Preferisco non specificare</option>
            <option value="IT">Italia</option>
            <option value="CH">Svizzera</option>
            <option value="SM">San Marino</option>
            <option value="FR">Francia</option>
            <option value="DE">Germania</option>
            <option value="ES">Spagna</option>
            <option value="GB">Regno Unito</option>
            <option value="US">Stati Uniti</option>
            <option value="ALTRO">Altro</option>
          </select>
        </div>

        <div>
          <label class="field-label" for="reg-esperienza">Livello di esperienza nel trading <span style="color:var(--text-faint);">(facoltativo)</span></label>
          <select id="reg-esperienza">
            <option value="" selected>Preferisco non specificare</option>
            <option value="principiante">Principiante (meno di 1 anno)</option>
            <option value="intermedio">Intermedio (1-3 anni)</option>
            <option value="avanzato">Avanzato (oltre 3 anni)</option>
          </select>
        </div>

        <div>
          <label class="field-label" for="reg-referral">Come ci hai conosciuto? <span style="color:var(--text-faint);">(facoltativo)</span></label>
          <select id="reg-referral">
            <option value="" selected>Preferisco non specificare</option>
            <option value="social">Social media</option>
            <option value="passaparola">Passaparola / amici</option>
            <option value="motore_ricerca">Motore di ricerca</option>
            <option value="pubblicita">Pubblicità online</option>
            <option value="altro">Altro</option>
          </select>
        </div>

        <div class="consents">
          <label>
            <input type="checkbox" id="reg-consent-age">
            <span>Dichiaro di avere almeno 16 anni. *</span>
          </label>
          <label>
            <input type="checkbox" id="reg-consent-terms">
            <span>Ho letto e accetto i <a href="termini.html" target="_blank">Termini di Servizio</a>
            e l'<a href="privacy.html" target="_blank">Informativa Privacy</a>. *</span>
          </label>
          <label>
            <input type="checkbox" id="reg-consent-marketing">
            <span>Desidero ricevere via email novità, consigli e comunicazioni promozionali su TradeJournalist (facoltativo).</span>
          </label>
        </div>

        <div id="reg-error"></div>
        <button type="submit" id="reg-submit-btn" class="btn btn-primary">Crea account</button>
      </form>

      <div class="foot">Hai già un account? <a href="index.html">Accedi</a></div>

      <div style="text-align:center; margin-top:18px; padding-top:14px; border-top:1px solid var(--border,#232B37); font-size:11.5px; line-height:1.9; color:var(--text-dim,#8592A3);">
        <a href="privacy.html" target="_blank" style="color:var(--text-dim,#8592A3);">Privacy</a>
        &nbsp;·&nbsp;<a href="termini.html" target="_blank" style="color:var(--text-dim,#8592A3);">Termini</a>
        &nbsp;·&nbsp;<a href="cookie.html" target="_blank" style="color:var(--text-dim,#8592A3);">Cookie</a>
        &nbsp;·&nbsp;<a href="docs.html" style="color:var(--text-dim,#8592A3);">Documentazione</a>
      </div>
    </div>

    <div id="reg-success-block" class="success">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" width="40" height="40" style="margin:0 auto;"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
      <h2>Account creato!</h2>
      <p>Ti abbiamo inviato un'email di conferma. Verifica il tuo indirizzo per iniziare a usare TradeJournalist.</p>
      <div class="foot"><a href="index.html">Vai al login</a></div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="register.js"></script>
</body>
</html>
